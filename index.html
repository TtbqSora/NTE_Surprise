<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>异环 NTE - 彩蛋地图</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1a1a1a; color: #fff; font-family: sans-serif;}
        #map { height: 100vh; width: 100vw; background-color: #2a2a2a; z-index: 1; }
        .leaflet-control-attribution { display: none; }
        
        /* 标记点基础样式 */
        .custom-marker .marker-inner {
            width: 16px; height: 16px;
            background-color: #ff3b30;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(var(--marker-scale, 1));
        }
        .custom-marker:hover .marker-inner { transform: scale(calc(var(--marker-scale, 1) * 1.5)); }

        /* 选中标记点的特殊状态高亮 */
        .custom-marker .marker-inner.marker-selected {
            background-color: #fbbf24 !important; /* 黄色 */
            border-color: #fff !important;
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.4), 0 0 15px rgba(251, 191, 36, 0.8) !important;
            transform: scale(calc(var(--marker-scale, 1) * 1.6));
            z-index: 9999 !important;
        }

        /* 覆盖 Leaflet 弹窗默认样式，使其贴合暗黑主题 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background-color: #1f2937; color: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); border: 1px solid #374151;}
        .leaflet-popup-content { margin: 8px; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .pointer-events-auto { pointer-events: auto; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
        
        .img-placeholder {
            width: 100%; height: 120px; background-color: #222; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 0.5rem; border: 1px dashed #444;
        }

        #sidebar { min-width: 300px; max-width: 800px; }
        .sidebar-width { width: 360px; } 
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-layer" class="flex justify-between items-stretch">
        
        <div class="relative flex-1">
            <!-- 1. 左上角设置按钮  -->
            <div class="absolute top-6 left-6 pointer-events-auto z-50">
                <div class="relative">
                    <button onclick="toggleSettings()" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="地图设置">
                        <i data-lucide="settings" class="text-gray-300 group-hover:text-white transform group-hover:rotate-90 transition duration-300"></i>
                    </button>
                    <!-- 设置菜单 -->
                    <div id="settings-menu" class="hidden absolute top-full left-0 mt-3 bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-xl w-56">
                        <h3 class="text-sm font-semibold text-gray-400 mb-4 uppercase">地图设置</h3>
                        
                        <!-- 增加的 GitHub 链接项 -->
                        <a href="https://github.com/TtbqSora/NTE_Surprise" target="_blank" class="flex items-center justify-between cursor-pointer mb-5 group text-decoration-none">
                            <span class="text-sm text-gray-200 group-hover:text-white flex items-center gap-2">
                                <i data-lucide="github" class="w-4 h-4"></i> GitHub 仓库
                            </span>
                            <i data-lucide="external-link" class="w-4 h-4 text-gray-500 group-hover:text-gray-300"></i>
                        </a>
                        
                        <!-- 拨动开关 -->
                        <label class="flex items-center justify-between cursor-pointer mb-4 group">
                            <span class="text-sm text-gray-200 group-hover:text-white">合并点位 (集群)</span>
                            <div class="relative flex items-center">
                                <input type="checkbox" id="toggle-cluster" class="peer sr-only" onchange="toggleClustering(this.checked)">
                                <div class="w-10 h-6 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors duration-300"></div>
                                <div class="absolute left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 transform peer-checked:translate-x-4"></div>
                            </div>
                        </label>

                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-sm text-yellow-500 group-hover:text-yellow-400">获取坐标模式</span>
                            <div class="relative flex items-center">
                                <input type="checkbox" id="toggle-marking" class="peer sr-only" onchange="toggleMarkingMode(this.checked)">
                                <div class="w-10 h-6 bg-gray-600 rounded-full peer-checked:bg-yellow-600 transition-colors duration-300"></div>
                                <div class="absolute left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 transform peer-checked:translate-x-4"></div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 缩放控制栏 -->
            <div class="absolute left-6 top-1/2 transform -translate-y-1/2 flex flex-col items-center gap-1 z-50 pointer-events-auto bg-gray-800/95 p-2 rounded-xl shadow-lg border border-gray-600">
                <span class="text-[10px] font-mono text-gray-300 mb-1" id="zoom-text">1.0x</span>
                <button onclick="map.zoomIn()" class="w-8 h-8 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded-lg text-white shadow transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
                <div class="w-6 h-px bg-gray-600 my-1"></div>
                <button onclick="map.zoomOut()" class="w-8 h-8 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded-lg text-white shadow transition"><i data-lucide="minus" class="w-4 h-4"></i></button>
                <button onclick="map.setZoom(map.getMinZoom())" class="w-8 h-8 flex items-center justify-center bg-blue-900 hover:bg-blue-800 rounded-lg text-blue-200 shadow transition mt-2" title="恢复最小倍率"><i data-lucide="maximize" class="w-4 h-4"></i></button>
            </div>

            <!-- 左下角按钮组 -->
            <div class="absolute bottom-6 left-6 flex flex-col gap-4 pointer-events-auto z-50">
                <button onclick="openSidebar('SOURCES')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="出处列表">
                    <i data-lucide="list-video" class="text-green-400 group-hover:text-green-300"></i>
                </button>
                <button onclick="openSidebar('UNMAPPED')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="非地图彩蛋">
                    <i data-lucide="map-pin-x" class="text-purple-400 group-hover:text-purple-300"></i>
                </button>
                <button onclick="openSidebar('CITIES')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="区域筛选">
                    <i data-lucide="map" class="text-blue-400 group-hover:text-blue-300"></i>
                </button>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div id="sidebar" class="sidebar-width bg-gray-900/95 border-l border-gray-700 shadow-2xl transition-transform duration-300 transform translate-x-full pointer-events-auto flex flex-col h-full z-50 relative">
            <div id="sidebar-resizer" class="absolute left-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-blue-500 z-50 transition-colors" title="拖动调整宽度"></div>
            <div id="sidebar-header" class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800 shrink-0"></div>
            <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 relative"></div>
        </div>
    </div>

<script>
    lucide.createIcons();

    const CONFIG = {
        mapWidth: 8192, 
        mapHeight: 8192,
        mapImageUrl: 'map.jpg',
        panExtraLeftOffset: 150,
        panDuration: 0.5,
        minPanZoom: 0 
    };

    let db = { locations: [], sources: [], unmapped: [] };

    const eggMap = {}; 
    const sourceEggsMap = {}; 
    const cityDistrictsMap = {}; 

    // 自定义排序函数：英文/数字优先，其次中文按拼音
    function sortByNameEngFirst(a, b) {
        const nameA = a.name || '';
        const nameB = b.name || '';
        
        // 匹配是否以英文字母或数字开头
        const isAlnumA = /^[a-zA-Z0-9]/i.test(nameA);
        const isAlnumB = /^[a-zA-Z0-9]/i.test(nameB);
        
        if (isAlnumA && !isAlnumB) return -1;
        if (!isAlnumA && isAlnumB) return 1;
        
        // 同类型则使用 localeCompare (拼音顺序)
        return nameA.localeCompare(nameB, 'zh-CN');
    }
    
    function buildIndexes() {
        db.sources.forEach(s => sourceEggsMap[s.id] = []);
        db.locations.forEach(loc => {
            if(!cityDistrictsMap[loc.city]) cityDistrictsMap[loc.city] = new Set();
            cityDistrictsMap[loc.city].add(loc.district);
            loc.eggs.forEach(egg => {
                egg.location = loc; 
                eggMap[egg.id] = egg;
                if(sourceEggsMap[egg.source_id]) sourceEggsMap[egg.source_id].push(egg);
            });
        });
        db.unmapped.forEach(egg => {
            eggMap[egg.id] = egg;
            if(!sourceEggsMap[egg.source_id]) sourceEggsMap[egg.source_id] = [];
            sourceEggsMap[egg.source_id].push(egg);
        });

        // 对每一个出处内部收集到的彩蛋列表也进行排序
        for (let srcId in sourceEggsMap) {
            sourceEggsMap[srcId].sort(sortByNameEngFirst);
        }
    }

    // ---------------- 地图初始化 ---------------- //
    const map = L.map('map', { 
        crs: L.CRS.Simple, 
        minZoom: -2, 
        maxZoom: 2, 
        zoomSnap: 0.25,
        zoomControl: false, 
        attributionControl: false 
    });
    const bounds = [[0, 0], [CONFIG.mapHeight, CONFIG.mapWidth]];
    
    // 修改点 2：扩大地图可拖动范围（设置上下左右各 4000 像素的缓冲边界），避免边缘回弹严重
    const padding = 4000;
    const maxBounds = [[-padding, -padding], [CONFIG.mapHeight + padding, CONFIG.mapWidth + padding]];
    
    L.imageOverlay(CONFIG.mapImageUrl, bounds).addTo(map);
    map.setView([CONFIG.mapHeight / 2, CONFIG.mapWidth / 2], 0);
    map.setMaxBounds(maxBounds); // 使用扩大后的边界限制

    let isMarkingMode = false;
    let isClustered = false; // 初始化：不启用集群
    let activeRegionFilter = null; 
    let currentSelectedMarker = null; 
    
    const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 50, spiderfyOnMaxZoom: true, zoomToBoundsOnClick: true });
    const normalGroup = L.layerGroup();
    // 修改点 1：默认初始加载散点图层
    let currentLayerGroup = normalGroup;
    map.addLayer(currentLayerGroup);

    const allMarkers = [];

    // ---------------- 缩放 UI 更新与图标大小自适应 ---------------- //
    function updateZoomUI() {
        const zoom = map.getZoom();
        const scaleText = Math.pow(2, zoom).toFixed(2);
        document.getElementById('zoom-text').innerText = `${scaleText}x`;

        const markerScale = 1 + (zoom * 0.2); 
        document.documentElement.style.setProperty('--marker-scale', Math.max(0.4, markerScale));
    }
    map.on('zoom', updateZoomUI);
    updateZoomUI();

    // ---------------- 侧边栏拖拽调宽功能 ---------------- //
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebar-resizer');
    let isResizing = false;

    const savedWidth = localStorage.getItem('sidebarWidth');
    if (savedWidth) sidebar.style.width = savedWidth + 'px';

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = window.innerWidth - e.clientX;
        if (newWidth > 300 && newWidth < 800) {
            sidebar.style.width = newWidth + 'px';
        }
    });
    window.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            document.body.style.cursor = '';
            localStorage.setItem('sidebarWidth', sidebar.offsetWidth);
        }
    });

    // ---------------- 加载外部 JSON 数据 ---------------- //
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            db = data;
            
            // 应用自定义的英文/数字优先排序规则
            db.sources.sort(sortByNameEngFirst);
            
            // 为地图上的每个点位内的彩蛋列表排序
            db.locations.forEach(loc => {
                loc.eggs.sort(sortByNameEngFirst);
            });

            // 为非地图彩蛋排序
            db.unmapped.sort(sortByNameEngFirst);
            
            buildIndexes(); 
            renderMarkers(); 
        })
        .catch(err => console.error('获取 data.json 失败:', err));

    // 独立生成弹窗 HTML 的函数，用于动态更新
    function generatePopupHtml(egg, totalCount) {
        const othersText = totalCount > 1 ? `<div class="text-[10px] text-gray-400 mt-1">该坐标点共 ${totalCount} 个彩蛋 (在右侧点击切换)</div>` : '';
        
        let popupImgHtml = '';
        if (egg.has_main) {
            popupImgHtml = `<img src="${egg.image_main}" class="w-full h-24 object-cover rounded border border-gray-600 mb-1" alt="游戏内截图">`;
        }

        return `
            <div class="text-center min-w-[140px]">
                <div class="text-xs font-bold mb-0.5 truncate w-36 text-gray-200" title="${egg.name}">${egg.name}</div>
                <div class="text-[12px] text-yellow-500 mb-1.5 truncate w-36" title="${egg.source_name}">Neta: ${egg.source_name}</div>
                ${popupImgHtml}
                ${othersText}
            </div>
        `;
    }

    function renderMarkers() {
        clusterGroup.clearLayers();
        normalGroup.clearLayers();
        allMarkers.length = 0;
        currentSelectedMarker = null;

        db.locations.forEach(loc => {
            if (activeRegionFilter && loc.district !== activeRegionFilter) return;

            const latlng = L.latLng(loc.y, loc.x);
            const marker = L.marker(latlng, {
                icon: L.divIcon({ className: 'custom-marker', html: '<div class="marker-inner"></div>', iconSize: [16, 16], iconAnchor: [8, 8] })
            });

            // 弹窗内容构建
            const firstEgg = loc.eggs[0];
            const popupHtml = generatePopupHtml(firstEgg, loc.eggs.length);
            
            marker.bindPopup(popupHtml, { offset: [0, -10], closeButton: false, minWidth: 140 });

            marker.locationData = loc;
            
            marker.on('click', () => {
                if(isMarkingMode) return;
                
                if (currentSelectedMarker && currentSelectedMarker.getElement()) {
                    const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
                    if(inner) inner.classList.remove('marker-selected');
                }
                
                currentSelectedMarker = marker;
                if (marker.getElement()) {
                    const inner = marker.getElement().querySelector('.marker-inner');
                    if(inner) inner.classList.add('marker-selected');
                }

                openSidebar('LOCATION', { loc: loc });
                panMapTo(latlng);
            });
            
            allMarkers.push(marker);
            clusterGroup.addLayer(marker);
            normalGroup.addLayer(marker);
        });
    }

    // 解决 Leaflet 渲染复用导致高亮类名丢失的问题
    map.on('popupopen', function(e) {
        if(currentSelectedMarker && currentSelectedMarker.getElement()) {
            const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
            if(inner) inner.classList.add('marker-selected');
        }
    });

    function panMapTo(latlng) {
        const targetZoom = Math.max(map.getZoom(), CONFIG.minPanZoom);
        const sidebarWidth = sidebar.offsetWidth;
        const totalOffsetX = (sidebarWidth / 2) + CONFIG.panExtraLeftOffset;
        
        const targetPoint = map.project(latlng, targetZoom).add([totalOffsetX, 0]);
        const targetLatLng = map.unproject(targetPoint, targetZoom);
        
        map.flyTo(targetLatLng, targetZoom, { duration: CONFIG.panDuration });
    }

    map.on('click', (e) => {
        if(!isMarkingMode) closeSidebar();
    });

    // ---------------- 侧边栏视图管理 ---------------- //
    function openSidebar(view, payload = null) {
        sidebar.classList.remove('translate-x-full');
        renderSidebarContent(view, payload);
    }

    function closeSidebar() {
        sidebar.classList.add('translate-x-full');
        if (currentSelectedMarker && currentSelectedMarker.getElement()) {
            const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
            if(inner) inner.classList.remove('marker-selected');
            currentSelectedMarker.closePopup();
            currentSelectedMarker = null;
        }
    }

    function renderSidebarContent(view, payload) {
        const header = document.getElementById('sidebar-header');
        const content = document.getElementById('sidebar-content');
        content.innerHTML = ''; 
        
        switch(view) {
            case 'LOCATION':
                const loc = payload.loc;
                const backBtnHtml = payload.backTo ? 
                    `<button onclick="openSidebar('SOURCE_DETAIL', '${payload.backTo}')" class="mb-3 text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-gray-300 flex items-center gap-1 transition"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 返回出处列表</button>` : '';

                header.innerHTML = `
                    <div class="flex-1">
                        ${backBtnHtml}
                        <h2 class="text-lg font-bold text-white">坐标: [${loc.x}, ${loc.y}]</h2>
                        <p class="text-sm text-gray-400">${loc.city} - ${loc.district}</p>
                    </div>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-gray-700 rounded-full self-start"><i data-lucide="x" class="w-5 h-5 text-gray-300"></i></button>
                `;
                content.innerHTML = generateEggListHTML(loc.eggs);
                break;
            
            case 'CITIES':
                header.innerHTML = `
                    <h2 class="text-lg font-bold text-white">城市与区域</h2>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-gray-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-300"></i></button>
                `;
                let cityHtml = `<button onclick="filterByRegion(null)" class="w-full text-left p-3 bg-red-900/50 hover:bg-red-800/80 text-red-200 rounded-lg mb-4 text-sm font-bold flex justify-center items-center gap-2 transition shrink-0"><i data-lucide="eraser" class="w-4 h-4"></i> 清除区域筛选</button>`;
                
                for (const [city, districts] of Object.entries(cityDistrictsMap)) {
                    cityHtml += `
                        <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 mb-2 shrink-0">
                            <div class="p-3 cursor-pointer hover:bg-gray-700 flex justify-between font-bold text-gray-200" onclick="toggleCityAccordion('${city}')">
                                <span>${city}</span> <i data-lucide="chevron-down" id="icon-city-${city}" class="w-4 h-4 transition-transform"></i>
                            </div>
                            <div id="districts-${city}" class="hidden flex flex-col bg-gray-900">
                    `;
                    Array.from(districts).forEach(dist => {
                        const isActive = activeRegionFilter === dist;
                        cityHtml += `
                            <div class="p-3 pl-6 border-t border-gray-800 text-sm cursor-pointer hover:bg-gray-800 ${isActive ? 'text-blue-400 font-bold' : 'text-gray-400'}" onclick="filterByRegion('${dist}')">
                                ${dist}
                            </div>
                        `;
                    });
                    cityHtml += `</div></div>`;
                }
                content.innerHTML = cityHtml;
                break;

            case 'SOURCES':
                header.innerHTML = `
                    <h2 class="text-lg font-bold text-white">原出处总表</h2>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-gray-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-300"></i></button>
                `;
                content.innerHTML = `
                    <div class="sticky top-0 bg-gray-900/95 pb-2 z-10 shrink-0">
                        <input type="text" id="source-search" placeholder="搜索出处..." oninput="filterSources(this.value)" class="w-full bg-gray-800 border border-gray-700 text-sm text-white rounded p-2 focus:outline-none focus:border-blue-500">
                    </div>
                    <div id="source-list-container" class="flex flex-col gap-2 pb-4"></div>
                `;
                filterSources(""); 
                break;

            case 'UNMAPPED':
                header.innerHTML = `
                    <h2 class="text-lg font-bold text-white">非地图彩蛋</h2>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-gray-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-300"></i></button>
                `;
                content.innerHTML = `
                    <div class="sticky top-0 bg-gray-900/95 pb-2 z-10 shrink-0">
                        <input type="text" id="unmapped-search" placeholder="搜索彩蛋名称..." oninput="filterUnmapped(this.value)" class="w-full bg-gray-800 border border-gray-700 text-sm text-white rounded p-2 focus:outline-none focus:border-purple-500">
                    </div>
                    <div id="unmapped-list-container" class="flex flex-col gap-2 pb-4"></div>
                `;
                filterUnmapped("");
                break;

            case 'SOURCE_DETAIL':
                const source = db.sources.find(s => s.id === payload);
                const eggs = sourceEggsMap[source.id] || [];
                header.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 overflow-hidden">
                        <button onclick="openSidebar('SOURCES')" class="p-1 hover:bg-gray-700 rounded-full shrink-0"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-300"></i></button>
                        <h2 class="text-base font-bold text-white truncate w-40" title="${source.name}">${source.name}</h2>
                    </div>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-gray-700 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-300"></i></button>
                `;
                content.innerHTML = `<p class="text-xs text-gray-400 mb-2 shrink-0">共发现 ${eggs.length} 个相关彩蛋</p>` + generateEggListHTML(eggs, true);
                break;
        }
        lucide.createIcons();
    }

    // ---------------- HTML 生成器与交互逻辑 ---------------- //
    function generateEggListHTML(eggs, isFromSourceView = false) {
        if(eggs.length === 0) return `<div class="text-center text-gray-500 mt-10">暂无数据</div>`;
        return eggs.map((egg) => {
            const isUnmapped = egg.is_unmapped;
            const clickAction = isFromSourceView ? `onclick="handleSourceEggClick('${egg.id}')"` : `onclick="toggleEggDetail('egg-${egg.id}')"`;
            
            const multiTag = egg.is_multi_location ? '<span class="bg-purple-900 text-purple-200 text-[10px] px-1.5 py-0.5 rounded shrink-0 border border-purple-700" title="该彩蛋在地图中有多处出现，此为代表点位">多点位</span>' : '';
            // 修改点 2：移除了此处的 unmappedTag / NP 标签渲染

            return `
            <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-sm shrink-0">
                <div class="p-3 cursor-pointer hover:bg-gray-700 flex justify-between items-center group" ${clickAction}>
                    <div class="flex items-center gap-2 flex-1 overflow-hidden">
                        ${multiTag}
                        <span class="bg-blue-900 text-blue-300 text-xs px-2 py-0.5 rounded shrink-0">${egg.type || '未知'}</span>
                        <h3 class="font-bold text-sm text-gray-200 truncate group-hover:text-white transition" title="${egg.name}">${egg.name}</h3>
                    </div>
                    ${isFromSourceView ? 
                        `<i data-lucide="${isUnmapped ? 'chevron-down' : 'map-pin'}" class="text-gray-400 w-4 h-4 shrink-0 ml-2"></i>` : 
                        `<i data-lucide="chevron-down" id="icon-egg-${egg.id}" class="text-gray-400 transition-transform w-4 h-4 shrink-0 ml-2"></i>`}
                </div>
                <div id="detail-egg-${egg.id}" class="hidden p-3 border-t border-gray-700 bg-gray-900">
                    <div class="flex justify-between items-start mb-2">
                        ${!isFromSourceView ? `<p class="text-xs text-yellow-500 font-semibold">出处: ${egg.source_name}</p>` : '<div></div>'}
                        <span class="text-[10px] font-mono text-gray-500 bg-gray-800 px-1 rounded">${egg.id}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-3">${egg.remark || '暂无备注说明'}</p>
                    
                    ${generateEggImagesHTML(egg)}

                </div>
            </div>`;
        }).join('');
    }

    // 动态生成图片 HTML 块
    function generateEggImagesHTML(egg) {
        if (!egg.has_main && !egg.has_compare) {
            return ''; 
        }
        
        let cols = (egg.has_main && egg.has_compare) ? 'grid-cols-2' : 'grid-cols-1';
        let html = `<div class="grid ${cols} gap-2 mt-2">`;
        
        if (egg.has_main) {
            html += `
                <div class="relative group overflow-hidden rounded border border-gray-600 bg-black">
                    <img src="${egg.image_main}" class="w-full h-auto max-h-32 object-contain" alt="游戏内截图">
                    <div class="absolute bottom-0 left-0 right-0 bg-black/70 text-center text-[10px] py-1 text-gray-300">游戏内截图</div>
                </div>`;
        }
        if (egg.has_compare) {
            html += `
                <div class="relative group overflow-hidden rounded border border-gray-600 bg-black">
                    <img src="${egg.image_compare}" class="w-full h-auto max-h-32 object-contain" alt="出处对比图">
                    <div class="absolute bottom-0 left-0 right-0 bg-black/70 text-center text-[10px] py-1 text-gray-300">出处对比图</div>
                </div>`;
        }
        
        html += `</div>`;
        return html;
    }

    function handleSourceEggClick(eggId) {
        const egg = eggMap[eggId];
        if (egg.is_unmapped) {
            toggleEggDetail(`egg-${egg.id}`); 
        } else {
            const targetMarker = allMarkers.find(m => m.locationData.id === egg.location.id);
            if (targetMarker) {
                targetMarker.fire('click');
                openSidebar('LOCATION', { loc: egg.location, backTo: egg.source_id });
                setTimeout(() => targetMarker.openPopup(), 100); 
            }
        }
    }

    function toggleEggDetail(id) {
        const detailDiv = document.getElementById(`detail-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if (detailDiv.classList.contains('hidden')) {
            detailDiv.classList.remove('hidden');
            if(icon) icon.classList.add('rotate-180');
        } else {
            detailDiv.classList.add('hidden');
            if(icon) icon.classList.remove('rotate-180');
        }

        // 修改点 1：当侧边栏点击展开/收起某个彩蛋时，动态更新地图对应标记的弹窗内容
        const eggId = id.replace('egg-', '');
        const egg = eggMap[eggId];
        if (egg && !egg.is_unmapped && egg.location) {
            const targetMarker = allMarkers.find(m => m.locationData.id === egg.location.id);
            if (targetMarker) {
                targetMarker.setPopupContent(generatePopupHtml(egg, egg.location.eggs.length));
            }
        }
    }

    function toggleCityAccordion(city) {
        const div = document.getElementById(`districts-${city}`);
        const icon = document.getElementById(`icon-city-${city}`);
        div.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function filterByRegion(district) {
        activeRegionFilter = district;
        renderMarkers(); 
        openSidebar('CITIES'); 
    }

    function filterSources(keyword) {
        const container = document.getElementById('source-list-container');
        if(!container) return;
        
        const lowerKw = keyword.toLowerCase();
        const html = db.sources
            .filter(s => s.name.toLowerCase().includes(lowerKw))
            .map(s => `
                <div class="p-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg cursor-pointer text-sm text-gray-200 transition flex justify-between items-center shrink-0" onclick="openSidebar('SOURCE_DETAIL', '${s.id}')">
                    <span class="font-semibold">${s.name}</span>
                    <span class="text-xs text-gray-500 bg-gray-900 px-2 py-1 rounded-full">${sourceEggsMap[s.id]?.length || 0}</span>
                </div>
            `).join('');
        container.innerHTML = html || `<div class="text-center text-gray-500 text-sm mt-4">未找到结果</div>`;
    }

    function filterUnmapped(keyword) {
        const container = document.getElementById('unmapped-list-container');
        if(!container) return;
        
        const lowerKw = keyword.toLowerCase();
        const filteredEggs = db.unmapped.filter(egg => egg.name.toLowerCase().includes(lowerKw) || egg.source_name.toLowerCase().includes(lowerKw));
        
        container.innerHTML = generateEggListHTML(filteredEggs, false); 
        lucide.createIcons();
    }

    // ---------------- 设置与工具 ---------------- //
    function toggleSettings() {
        document.getElementById('settings-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('settings-menu');
        const settingsBtn = menu.previousElementSibling;
        if (!menu.contains(event.target) && !settingsBtn.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });

    let markingPopup = L.popup();
    function toggleMarkingMode(enabled) {
        isMarkingMode = enabled;
        closeSidebar();
        
        if (isMarkingMode) {
            map.removeLayer(currentLayerGroup);
            map.on('click', onMapClickForMarking);
            document.getElementById('map').style.cursor = 'crosshair';
        } else {
            map.addLayer(currentLayerGroup);
            map.off('click', onMapClickForMarking);
            document.getElementById('map').style.cursor = '';
            map.closePopup();
        }
    }

    function onMapClickForMarking(e) {
        if (!isMarkingMode) return;
        const x = Math.round(e.latlng.lng);
        const y = Math.round(e.latlng.lat);
        markingPopup.setLatLng(e.latlng).setContent(`
            <div class="text-center font-mono text-gray-900">
                <div class="font-bold text-gray-900 mb-1">目标坐标</div>
                <div class="bg-gray-200 p-2 rounded text-sm select-all border border-gray-300">"x": ${x}, "y": ${y}</div>
            </div>
        `).openOn(map);
    }

    function toggleClustering(enabled) {
        isClustered = enabled;
        if (isMarkingMode) return; 
        map.removeLayer(currentLayerGroup);
        currentLayerGroup = isClustered ? clusterGroup : normalGroup;
        map.addLayer(currentLayerGroup);
    }

</script>
</body>
</html>
