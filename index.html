<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>异环 NTE - 圣地巡礼彩蛋地图</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1a1a1a; color: #fff; font-family: sans-serif;}
        #map { height: 100vh; width: 100vw; background-color: #2a2a2a; z-index: 1; }
        .leaflet-control-attribution { display: none; }
        
        /* 标记点基础样式 */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-marker .marker-inner {
            width: 14px; height: 14px;
            background-color: #ff3b30;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(var(--marker-scale, 1));
        }

        /* 图片点位图标：外层仍叫 marker-inner，选中高亮和缩放逻辑就能继续复用 */
        .custom-marker .marker-icon-frame {
            width: 26px;
            height: 26px;
            background-color: rgba(17, 24, 39, 0.85);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .custom-marker .marker-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* icon 图片没找到时，JS 会加这个类，让它退回成现有红色圆点 */
        .custom-marker .marker-icon-frame.icon-missing {
            width: 14px;
            height: 14px;
            padding: 0;
            background-color: #ff3b30;
        }

        .custom-marker .marker-icon-frame.icon-missing .marker-icon-img {
            display: none;
        }

        .custom-marker:hover .marker-inner { transform: scale(calc(var(--marker-scale, 1) * 1.5)); }

        /* 选中标记点的特殊状态高亮 */
        .custom-marker .marker-inner.marker-selected {
            background-color: #fbbf24 !important; /* 黄色 */
            border-color: #fff !important;
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.4), 0 0 15px rgba(251, 191, 36, 0.8) !important;
            transform: scale(calc(var(--marker-scale, 1) * 1.6));
            z-index: 9999 !important;
        }

        /* 覆盖 Leaflet 弹窗默认样式，使其贴合暗黑主题 */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background-color: #1f2937; color: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); border: 1px solid #374151;}
        .leaflet-popup-content { margin: 8px; box-sizing: border-box; }

        /* 弹窗主体宽度由 JS 按图片数量计算，避免 Leaflet 首次打开时测量过窄 */
        .marker-popup-content,
        .marker-popup-content * {
            box-sizing: border-box;
        }

        /* 鼠标悬停预览卡片：固定宽度后，内部图片不会把 Leaflet tooltip 外框撑歪 */
        .marker-hover-tooltip {
            background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(75, 85, 99, 0.9);
            border-radius: 6px;
            color: #f9fafb;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
            padding: 0;
            width: 176px;
            max-width: 176px;
            box-sizing: border-box;
            white-space: normal;
            overflow: hidden;
        }

        .marker-hover-tooltip::before {
            border-top-color: rgba(17, 24, 39, 0.96);
        }

        .marker-hover-card {
            width: 160px;
            box-sizing: border-box;
        }

        .marker-hover-image {
            width: 100%;
            box-sizing: border-box;
        }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .pointer-events-auto { pointer-events: auto; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
        
        .img-placeholder {
            width: 100%; height: 120px; background-color: #222; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 0.5rem; border: 1px dashed #444;
        }

        #sidebar { min-width: 300px; max-width: 800px; }
        .sidebar-width { width: 360px; } 

        #viewer-image {
            cursor: grab;
            user-select: none; 
            -webkit-user-drag: none; 
        }
        #viewer-image:active {
            cursor: grabbing;
        }

        /* 底部缩放滑条：width 控制整体长度，height 控制轨道占用空间 */
        .zoom-slider {
            width: min(36vw, 280px);
            height: 3px;
            accent-color: #60a5fa;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
        }

        /* WebKit 内核浏览器（Chrome / Edge / Safari）的滑条轨道 */
        .zoom-slider::-webkit-slider-runnable-track {
            height: 3px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.55);
        }

        /* 滑条圆点大小：调小 width / height 可以让控件更轻巧 */
        .zoom-slider::-webkit-slider-thumb {
            width: 10px;
            height: 10px;
            margin-top: -3.5px;
            border-radius: 999px;
            background: #e5e7eb;
            border: 2px solid #60a5fa;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Firefox 的滑条轨道 */
        .zoom-slider::-moz-range-track {
            height: 3px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.55);
        }

        .zoom-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #e5e7eb;
            border: 2px solid #60a5fa;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-layer" class="flex justify-between items-stretch">
        
        <div class="relative flex-1">
            <!-- 左上角设置按钮  -->
            <div class="absolute top-6 left-6 pointer-events-auto z-50">
                <div class="relative">
                    <button onclick="toggleSettings()" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="地图设置">
                        <i data-lucide="settings" class="text-gray-300 group-hover:text-white transform group-hover:rotate-90 transition duration-300"></i>
                    </button>
                    <!-- 设置菜单 -->
                    <div id="settings-menu" class="hidden absolute top-full left-0 mt-3 bg-gray-800 border border-gray-700 rounded-lg p-4 shadow-xl w-56">
                        <h3 class="text-sm font-semibold text-gray-400 mb-4 uppercase">地图设置</h3>
                        
                        <a href="https://github.com/TtbqSora/NTE_Surprise" target="_blank" class="flex items-center justify-between cursor-pointer mb-5 group text-decoration-none">
                            <span class="text-sm text-gray-200 group-hover:text-white flex items-center gap-2">
                                <i data-lucide="github" class="w-4 h-4"></i> GitHub 仓库
                            </span>
                            <i data-lucide="external-link" class="w-4 h-4 text-gray-500 group-hover:text-gray-300"></i>
                        </a>
                        
                        <!-- 拨动开关 -->
                        <label class="flex items-center justify-between cursor-pointer mb-4 group">
                            <span class="text-sm text-gray-200 group-hover:text-white">合并点位 (集群)</span>
                            <div class="relative flex items-center">
                                <input type="checkbox" id="toggle-cluster" class="peer sr-only" onchange="toggleClustering(this.checked)">
                                <div class="w-10 h-6 bg-gray-600 rounded-full peer-checked:bg-blue-600 transition-colors duration-300"></div>
                                <div class="absolute left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 transform peer-checked:translate-x-4"></div>
                            </div>
                        </label>

                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-sm text-yellow-500 group-hover:text-yellow-400">获取坐标模式</span>
                            <div class="relative flex items-center">
                                <input type="checkbox" id="toggle-marking" class="peer sr-only" onchange="toggleMarkingMode(this.checked)">
                                <div class="w-10 h-6 bg-gray-600 rounded-full peer-checked:bg-yellow-600 transition-colors duration-300"></div>
                                <div class="absolute left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 transform peer-checked:translate-x-4"></div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 当前地图提示。进入副本地图后，这里会显示返回大世界的按钮。 -->
            <div id="map-switcher" class="hidden absolute top-6 left-20 pointer-events-auto z-50 flex items-center gap-2 bg-gray-900/80 border border-gray-700 rounded-full shadow-lg px-2 py-2 backdrop-blur-sm">
                <button id="return-world-btn" onclick="switchMap('world')" class="hidden w-8 h-8 items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-blue-200 transition" title="返回大世界" aria-label="返回大世界">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <span id="current-map-name" class="text-xs text-gray-200 pr-2"></span>
            </div>

            <!-- 缩放控制栏 -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex items-center gap-2 z-50 pointer-events-auto bg-gray-900/55 px-2 py-1 rounded-md backdrop-blur-sm">
                <input id="zoom-slider" class="zoom-slider" type="range" min="1" max="5" step="0.25" value="1" aria-label="地图缩放">
                <button onclick="resetMapView()" class="w-4 h-4 flex items-center justify-center bg-gray-800/80 hover:bg-gray-700 rounded text-blue-200 transition" title="恢复默认视口" aria-label="恢复默认视口">
                    <i data-lucide="home" class="w-2.5 h-2.5"></i>
                </button>
            </div>

            <!-- 左下角按钮组 -->
            <div class="absolute bottom-6 left-6 flex flex-col gap-4 pointer-events-auto z-50">
                <button onclick="openSidebar('SOURCES')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="出处列表">
                    <i data-lucide="list-video" class="text-green-400 group-hover:text-green-300"></i>
                </button>
                <button onclick="openSidebar('UNMAPPED')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="非地图彩蛋">
                    <i data-lucide="map-pin-x" class="text-purple-400 group-hover:text-purple-300"></i>
                </button>
                <button onclick="openSidebar('CITIES')" class="bg-gray-800/90 hover:bg-gray-700 p-3 rounded-full shadow-lg border border-gray-600 transition group" title="区域筛选">
                    <i data-lucide="map" class="text-blue-400 group-hover:text-blue-300"></i>
                </button>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div id="sidebar" class="sidebar-width bg-gray-900/95 border-l border-gray-700 shadow-2xl transition-transform duration-300 transform translate-x-full pointer-events-auto flex flex-col h-full z-50 relative">
            <div id="sidebar-resizer" class="absolute left-0 top-0 bottom-0 w-1.5 cursor-col-resize hover:bg-blue-500 z-50 transition-colors" title="拖动调整宽度"></div>
            <div id="sidebar-header" class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800 shrink-0"></div>
            <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 relative"></div>
        </div>
    </div>

    <!-- ==================== 额外功能区域 ==================== -->
    
    <!-- 图片查看器 (Lightbox) 开始 -->
    <div id="image-viewer" class="hidden fixed inset-0 z-[9999] bg-black/90 flex justify-center items-center overflow-hidden transition-opacity duration-300 opacity-0 pointer-events-auto">
        <div id="viewer-title" class="absolute top-6 left-1/2 transform -translate-x-1/2 text-gray-100 text-sm bg-gray-900/80 px-4 py-1.5 rounded-full pointer-events-none z-50 shadow-lg border border-gray-700"></div>
        <button id="viewer-prev" class="hidden absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-white bg-gray-800/80 hover:bg-gray-600 border border-gray-600 shadow-lg rounded-full p-3 transition-colors cursor-pointer z-50" onclick="showPreviousViewerImage()" title="上一张">
            <i data-lucide="chevron-left" class="w-7 h-7"></i>
        </button>
        <button id="viewer-next" class="hidden absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-white bg-gray-800/80 hover:bg-gray-600 border border-gray-600 shadow-lg rounded-full p-3 transition-colors cursor-pointer z-50" onclick="showNextViewerImage()" title="下一张">
            <i data-lucide="chevron-right" class="w-7 h-7"></i>
        </button>
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-gray-300 text-xs md:text-sm bg-gray-900/80 px-4 py-2 rounded-full pointer-events-none z-50 shadow-lg border border-gray-700 flex flex-col md:flex-row items-center gap-1 md:gap-3">
            <span class="flex items-center gap-1.5"><i data-lucide="mouse-pointer-click" class="w-4 h-4"></i> 滚轮缩放 / 拖拽平移</span>
            <span id="viewer-position" class="text-gray-400"></span>
        </div>
        <img id="viewer-image" src="" class="max-w-[90vw] max-h-[90vh] object-contain shadow-2xl" alt="大图预览">
        <button class="absolute top-4 right-4 md:top-6 md:right-6 text-white bg-gray-800/80 hover:bg-gray-600 border border-gray-600 shadow-lg rounded-full p-2.5 transition-colors cursor-pointer z-50" onclick="closeImageViewer()" title="关闭">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>
    <!-- 图片查看器 (Lightbox) 结束 -->

<script>
    lucide.createIcons();

    const WORLD_MAP_ID = 'world';

    // 地图基础参数：副本地图没有单独配置时，会沿用这组默认尺寸和缩放。
    const CONFIG = {
        id: WORLD_MAP_ID,
        name: '大世界',
        mapWidth: 10240,
        mapHeight: 10240,
        offsetX: 2048,
        offsetY: 2048,
        tilePath: 'tiles/{z}/{x}/{z}_{x}_{y}.webp',
        minZoom: 1,
        // defaultZoom 控制“恢复默认视口”按钮回到的缩放级别。
        defaultZoom: 1,
        panExtraLeftOffset: 100,
        panDuration: 0.5,
        minPanZoom: 4, 
        maxZoomLevel: 5,
        defaultClustered: true,           
        disableClusterZoomLevel: 4        
    };

    let currentMapId = WORLD_MAP_ID;
    let currentTileLayer = null;
    let currentScaleFactor = 1 / Math.pow(2, CONFIG.maxZoomLevel);
    const mapProfiles = {};
    
    const customCRS = L.Util.extend({}, L.CRS.Simple, {
        transformation: new L.Transformation(
            currentScaleFactor,
            CONFIG.offsetX * currentScaleFactor,
            -currentScaleFactor,
            (CONFIG.mapHeight - CONFIG.offsetY) * currentScaleFactor
        )
    });

    function syncCrsToCurrentConfig() {
        // Leaflet 的像素坐标变换依赖地图尺寸和最高 zoom；切换不同尺寸地图时同步这组参数。
        currentScaleFactor = 1 / Math.pow(2, CONFIG.maxZoomLevel);
        customCRS.transformation = new L.Transformation(
            currentScaleFactor,
            CONFIG.offsetX * currentScaleFactor,
            -currentScaleFactor,
            (CONFIG.mapHeight - CONFIG.offsetY) * currentScaleFactor
        );
    }

    const map = L.map('map', { 
        crs: customCRS,       
        minZoom: CONFIG.minZoom,
        maxZoom: CONFIG.maxZoomLevel,
        // zoomSnap / zoomDelta 越小，滚轮和滑条缩放越细腻。
        zoomSnap: 0.25,
        zoomDelta: 0.25,
        zoomControl: false, 
        attributionControl: false 
    });

    function getMapBounds() {
        const minX = -CONFIG.offsetX;
        const minY = -CONFIG.offsetY;
        const maxX = CONFIG.mapWidth - CONFIG.offsetX;
        const maxY = CONFIG.mapHeight - CONFIG.offsetY;
        return [[minY, minX], [maxY, maxX]];
    }

    function createCurrentTileLayer() {
        return L.tileLayer(CONFIG.tilePath, {
            minZoom: CONFIG.minZoom,
            maxZoom: CONFIG.maxZoomLevel,
            noWrap: true,
            bounds: getMapBounds()
        });
    }

    currentTileLayer = createCurrentTileLayer().addTo(map);

    function getDefaultMapCenter() {
        return [(CONFIG.mapHeight / 2) - CONFIG.offsetY, (CONFIG.mapWidth / 2) - CONFIG.offsetX];
    }

    function resetMapView() {
        map.flyTo(getDefaultMapCenter(), CONFIG.defaultZoom, { duration: 0.45 });
    }

    map.setView(getDefaultMapCenter(), CONFIG.defaultZoom);

    let isMarkingMode = false;
    let isClustered = CONFIG.defaultClustered; 
    let activeRegionFilter = null; 
    let currentSelectedMarker = null; 
    
    const clusterGroup = L.markerClusterGroup({ 
        maxClusterRadius: 50, 
        spiderfyOnMaxZoom: true, 
        zoomToBoundsOnClick: true,
        disableClusteringAtZoom: CONFIG.disableClusterZoomLevel 
    });
    const normalGroup = L.layerGroup();
    
    let currentLayerGroup = isClustered ? clusterGroup : normalGroup;
    map.addLayer(currentLayerGroup);

    document.getElementById('toggle-cluster').checked = isClustered;

    const allMarkers = [];
    let db = { locations: [], sources: [], unmapped: [], maps: [], map_entries: [] };
    const eggMap = {}; 
    const sourceEggsMap = {}; 
    const cityDistrictsMap = {}; 
    const MARKER_ICON_EXTENSIONS = ['webp', 'png', 'svg', 'jpg', 'jpeg'];

    function readNumber(value, fallback) {
        // Map.csv 的可选配置可能为空；这里统一回退，避免空字符串变成 0。
        if (value === undefined || value === null || value === '') return fallback;
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
    }

    function normalizeMapProfile(rawMap = {}) {
        const rawId = String(rawMap.id ?? rawMap.map_id ?? '').trim();
        const id = rawId || WORLD_MAP_ID;
        const isWorld = id === WORLD_MAP_ID || rawMap.is_world === true;

        return {
            ...CONFIG,
            id,
            name: String(rawMap.name ?? (isWorld ? '大世界' : id)).trim() || id,
            mapWidth: readNumber(rawMap.map_width ?? rawMap.mapWidth, CONFIG.mapWidth),
            mapHeight: readNumber(rawMap.map_height ?? rawMap.mapHeight, CONFIG.mapHeight),
            offsetX: readNumber(rawMap.offset_x ?? rawMap.offsetX, CONFIG.offsetX),
            offsetY: readNumber(rawMap.offset_y ?? rawMap.offsetY, CONFIG.offsetY),
            tilePath: rawMap.tile_path || rawMap.tilePath || (isWorld ? CONFIG.tilePath : `tiles/${id}/{z}/{x}/{z}_{x}_{y}.webp`),
            minZoom: readNumber(rawMap.min_zoom ?? rawMap.minZoom, CONFIG.minZoom),
            maxZoomLevel: readNumber(rawMap.max_zoom ?? rawMap.maxZoom ?? rawMap.maxZoomLevel, CONFIG.maxZoomLevel),
            defaultZoom: readNumber(rawMap.default_zoom ?? rawMap.defaultZoom, CONFIG.defaultZoom),
            isWorld
        };
    }

    function setupMapProfiles() {
        Object.keys(mapProfiles).forEach(key => delete mapProfiles[key]);
        const incomingMaps = Array.isArray(db.maps) && db.maps.length ? db.maps : [{ id: WORLD_MAP_ID, name: '大世界', is_world: true }];

        incomingMaps.forEach(rawMap => {
            const profile = normalizeMapProfile(rawMap);
            mapProfiles[profile.id] = profile;
        });

        if (!mapProfiles[WORLD_MAP_ID]) {
            mapProfiles[WORLD_MAP_ID] = normalizeMapProfile({ id: WORLD_MAP_ID, name: '大世界', is_world: true });
        }
    }

    function applyMapProfile(profile) {
        Object.assign(CONFIG, profile);
        currentMapId = profile.id;
        syncCrsToCurrentConfig();

        map.setMinZoom(CONFIG.minZoom);
        map.setMaxZoom(CONFIG.maxZoomLevel);
        document.getElementById('zoom-slider').min = CONFIG.minZoom;
        document.getElementById('zoom-slider').max = CONFIG.maxZoomLevel;
        document.getElementById('zoom-slider').value = CONFIG.defaultZoom;

        if (currentTileLayer) {
            map.removeLayer(currentTileLayer);
        }

        currentTileLayer = createCurrentTileLayer().addTo(map);
    }

    function updateMapSwitcherUI() {
        const switcher = document.getElementById('map-switcher');
        const returnBtn = document.getElementById('return-world-btn');
        const nameEl = document.getElementById('current-map-name');
        const isWorld = currentMapId === WORLD_MAP_ID;

        switcher.classList.toggle('hidden', isWorld);
        returnBtn.classList.toggle('hidden', isWorld);
        returnBtn.classList.toggle('flex', !isWorld);
        nameEl.textContent = CONFIG.name;
        lucide.createIcons();
    }

    function switchMap(mapId, options = {}) {
        const targetProfile = mapProfiles[mapId] || mapProfiles[WORLD_MAP_ID];
        if (!targetProfile) return;

        closeSidebar();
        map.closePopup();
        activeRegionFilter = null;
        applyMapProfile(targetProfile);
        renderMarkers();
        updateMapSwitcherUI();

        if (options.latlng) {
            map.setView(options.latlng, options.zoom ?? CONFIG.defaultZoom);
        } else {
            map.setView(getDefaultMapCenter(), CONFIG.defaultZoom);
        }

        updateZoomUI();
    }

    function getLocationMapId(loc) {
        return String(loc.map_id || WORLD_MAP_ID);
    }

    function getEggMapId(egg) {
        return String(egg.map_id || egg.location?.map_id || WORLD_MAP_ID);
    }

    function getEntryMapId(entry) {
        return String(entry.map_id || entry.id || '');
    }

    function createMapEntryPopupHtml(entry) {
        const mapName = escapeHtml(entry.map_name || entry.name || entry.map_id);
        const mapId = escapeHtml(getEntryMapId(entry));

        return `
            <div class="text-center" style="width: 180px;">
                <div class="text-xs font-bold text-gray-100 mb-1">${mapName}</div>
                <div class="text-[10px] text-gray-400 mb-2">副本地图入口</div>
                <button onclick="switchMap('${mapId}')" class="w-full bg-blue-700 hover:bg-blue-600 text-white text-xs rounded py-1.5 transition">进入地图</button>
            </div>
        `;
    }

    function renderMapEntries() {
        if (currentMapId !== WORLD_MAP_ID || !Array.isArray(db.map_entries)) return;

        db.map_entries.forEach(entry => {
            const targetMapId = getEntryMapId(entry);
            if (!targetMapId || !mapProfiles[targetMapId]) return;

            const latlng = L.latLng(entry.y, entry.x);
            const marker = L.marker(latlng, {
                icon: createLocationMarkerIcon(entry)
            });

            marker.bindPopup(createMapEntryPopupHtml(entry), {
                offset: [0, -10],
                closeButton: false,
                minWidth: 180,
                maxWidth: 180
            });

            marker.bindTooltip(entry.map_name || targetMapId, {
                direction: 'top',
                offset: [0, -14],
                opacity: 0.95
            });

            marker.on('click', () => {
                if (isMarkingMode) return;
                switchMap(targetMapId);
            });

            clusterGroup.addLayer(marker);
            normalGroup.addLayer(marker);
        });
    }

    function sortByNameEngFirst(a, b) {
        const nameA = a.name || '';
        const nameB = b.name || '';
        
        const isAlnumA = /^[a-zA-Z0-9]/i.test(nameA);
        const isAlnumB = /^[a-zA-Z0-9]/i.test(nameB);
        
        if (isAlnumA && !isAlnumB) return -1;
        if (!isAlnumA && isAlnumB) return 1;
        
        return nameA.localeCompare(nameB, 'zh-CN');
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function formatMultilineText(value, fallback = '') {
        const rawText = String(value ?? '').trim();
        const text = rawText || fallback;
        if (!text) return '';

        return escapeHtml(text)
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .replace(/\\n/g, '\n')
            .replace(/\/n/g, '\n')
            .replace(/\n/g, '<br>');
    }

    function getLocationIconType(loc) {
        // 点位级 icon 优先；如果旧 data.json 没有这个字段，就使用该点位第一个填写了 icon_type 的彩蛋。
        const locationIcon = String(loc.icon_type ?? '').trim();
        if (locationIcon) return locationIcon;

        const iconEgg = (loc.eggs || []).find(egg => String(egg.icon_type ?? '').trim());
        return iconEgg ? String(iconEgg.icon_type).trim() : '';
    }

    function getMarkerIconCandidates(iconType) {
        const rawType = String(iconType ?? '').trim();
        if (!rawType) return [];

        // icon 类型会变成文件名；替换路径分隔符，避免误读到 icons 文件夹外。
        const safeType = rawType.replace(/[\\/]/g, '_');
        const hasKnownExtension = /\.(webp|png|svg|jpe?g)$/i.test(safeType);

        if (hasKnownExtension) {
            return [`icons/${encodeURIComponent(safeType)}`];
        }

        return MARKER_ICON_EXTENSIONS.map(ext => `icons/${encodeURIComponent(safeType)}.${ext}`);
    }

    function createDefaultMarkerIcon() {
        return L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-inner"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
    }

    function createLocationMarkerIcon(loc) {
        const iconType = getLocationIconType(loc);
        const candidates = getMarkerIconCandidates(iconType);

        if (!candidates.length) return createDefaultMarkerIcon();

        const candidatesAttr = escapeHtml(candidates.join('|'));
        const firstIcon = escapeHtml(candidates[0]);

        return L.divIcon({
            className: 'custom-marker custom-marker-with-icon',
            html: `
                <div class="marker-inner marker-icon-frame">
                    <img
                        class="marker-icon-img"
                        src="${firstIcon}"
                        data-icon-index="0"
                        data-icon-candidates="${candidatesAttr}"
                        onerror="handleMarkerIconError(this)"
                        alt="">
                </div>
            `,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });
    }

    function handleMarkerIconError(img) {
        const candidates = (img.dataset.iconCandidates || '').split('|').filter(Boolean);
        const nextIndex = Number(img.dataset.iconIndex || 0) + 1;

        if (nextIndex < candidates.length) {
            img.dataset.iconIndex = String(nextIndex);
            img.src = candidates[nextIndex];
            return;
        }

        const frame = img.closest('.marker-icon-frame');
        if (frame) frame.classList.add('icon-missing');
        img.onerror = null;
        img.removeAttribute('src');
    }

    function getEggImages(egg, imageKind) {
        // 新 data.json 会提供数组；旧 data.json 只有单张路径，这里做兼容。
        const listKey = imageKind === 'main' ? 'images_main' : 'images_compare';
        const singleKey = imageKind === 'main' ? 'image_main' : 'image_compare';
        const hasKey = imageKind === 'main' ? 'has_main' : 'has_compare';

        if (Array.isArray(egg[listKey]) && egg[listKey].length > 0) {
            return egg[listKey].filter(Boolean);
        }

        return egg[hasKey] && egg[singleKey] ? [egg[singleKey]] : [];
    }

    function getEggImageGroups(egg) {
        return {
            main: getEggImages(egg, 'main'),
            compare: getEggImages(egg, 'compare')
        };
    }
    
    function buildIndexes() {
        db.sources.forEach(s => sourceEggsMap[s.id] = []);
        db.locations.forEach(loc => {
            loc.map_id = getLocationMapId(loc);
            if(!cityDistrictsMap[loc.city]) cityDistrictsMap[loc.city] = new Set();
            cityDistrictsMap[loc.city].add(loc.district);
            loc.eggs.forEach(egg => {
                egg.map_id = getEggMapId({ ...egg, location: loc });
                egg.location = loc; 
                eggMap[egg.id] = egg;
                if(sourceEggsMap[egg.source_id]) sourceEggsMap[egg.source_id].push(egg);
            });
        });
        db.unmapped.forEach(egg => {
            egg.map_id = getEggMapId(egg);
            eggMap[egg.id] = egg;
            if(!sourceEggsMap[egg.source_id]) sourceEggsMap[egg.source_id] = [];
            sourceEggsMap[egg.source_id].push(egg);
        });

        for (let srcId in sourceEggsMap) {
            sourceEggsMap[srcId].sort(sortByNameEngFirst);
        }
    }


    function updateZoomUI() {
        const zoom = map.getZoom();
        // 地图可能被滚轮、双击或代码缩放；这里把真实 zoom 同步回滑条。
        document.getElementById('zoom-slider').value = zoom.toFixed(2);
        const markerScale = 0.2 + (zoom * 0.15); 
        document.documentElement.style.setProperty('--marker-scale', Math.max(0.2, markerScale));
    }
    document.getElementById('zoom-slider').addEventListener('input', (e) => {
        // range 输入框的值是字符串，parseFloat 后交给 Leaflet 设置缩放。
        map.setZoom(parseFloat(e.target.value));
    });
    map.on('zoom zoomend', updateZoomUI);
    updateZoomUI();

    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebar-resizer');
    let isResizing = false;

    const savedWidth = localStorage.getItem('sidebarWidth');
    if (savedWidth) sidebar.style.width = savedWidth + 'px';

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = window.innerWidth - e.clientX;
        if (newWidth > 300 && newWidth < 800) {
            sidebar.style.width = newWidth + 'px';
        }
    });
    window.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            document.body.style.cursor = '';
            localStorage.setItem('sidebarWidth', sidebar.offsetWidth);
        }
    });

    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            db = {
                locations: [],
                sources: [],
                unmapped: [],
                maps: [],
                map_entries: [],
                ...data
            };
            setupMapProfiles();
            applyMapProfile(mapProfiles[WORLD_MAP_ID]);
            updateMapSwitcherUI();
            db.sources.sort(sortByNameEngFirst);
            db.locations.forEach(loc => {
                loc.eggs.sort(sortByNameEngFirst);
            });

            buildIndexes();

        })

    function getPopupContentWidth(egg) {
        // 这里的数值是 Leaflet 弹窗“内容区”的宽度，不包含外层 8px margin。
        // 两张图并排时需要更宽；单图或无图时保持紧凑。
        const imageGroups = getEggImageGroups(egg);
        if (imageGroups.main.length && imageGroups.compare.length) return 320;
        if (imageGroups.main.length || imageGroups.compare.length) return 220;
        return 180;
    }

    function getPopupOptions(egg) {
        const width = getPopupContentWidth(egg);
        return {
            offset: [0, -10],
            closeButton: false,
            minWidth: width,
            maxWidth: width
        };
    }

    function updateMarkerPopup(marker, egg, totalCount) {
        const popupHtml = generatePopupHtml(egg, totalCount);
        const popupOptions = getPopupOptions(egg);
        const popup = marker.getPopup();

        if (popup) {
            // setPopupContent 不会自动同步 minWidth / maxWidth，所以切换彩蛋时手动更新配置。
            Object.assign(popup.options, popupOptions);
            marker.setPopupContent(popupHtml);
            popup.update();
        } else {
            marker.bindPopup(popupHtml, popupOptions);
        }
    }

    function generatePopupImageCard(egg, imageKind, images) {
        const isMain = imageKind === 'main';
        const label = isMain ? '游戏截图' : '出处对比';
        const altText = isMain ? '游戏内截图' : '出处对比图';
        const firstImage = escapeHtml(images[0]);
        // 只有同类图片超过 1 张时才显示数量角标，避免单图时界面信息过密。
        const countBadgeHtml = images.length > 1
            ? `<div class="absolute right-1 bottom-1 bg-black/80 text-[9px] text-gray-200 px-1.5 py-0.5 rounded-sm leading-none">${images.length} 张</div>`
            : '';

        return `
            <div class="w-full h-20 bg-black/60 rounded border border-gray-600 flex flex-col items-center justify-center overflow-hidden cursor-pointer hover:border-gray-400 transition-colors relative group" onclick="openImageViewerForEgg('${egg.id}', '${imageKind}', 0)" title="点击查看大图 (${altText})">
                <img src="${firstImage}" class="max-w-full max-h-full object-contain p-0.5" alt="${altText}">
                <div class="absolute bottom-0 w-full bg-black/70 text-[9px] text-gray-300 text-center py-0.5 opacity-0 group-hover:opacity-100 transition-opacity">${label}</div>
                ${countBadgeHtml}
            </div>
        `;
    }

    function generatePopupHtml(egg, totalCount) {
        const othersText = totalCount > 1 ? `<div class="text-[10px] text-gray-400 mt-1">该坐标点共 ${totalCount} 个彩蛋 (在右侧点击切换)</div>` : '';
        const remarkHtml = formatMultilineText(egg.remark);
        const remarkBlock = remarkHtml ? `<div class="text-[11px] text-gray-300 leading-relaxed text-left bg-gray-900/70 rounded px-2 py-1.5 mb-1.5">${remarkHtml}</div>` : '';
        
        // 根据是否有两张图片来动态决定外层容器宽度，保持和 Leaflet popup 配置一致。
        const imageGroups = getEggImageGroups(egg);
        const hasBothImages = imageGroups.main.length && imageGroups.compare.length;
        const popupWidth = getPopupContentWidth(egg);

        let popupImgHtml = '';
        if (imageGroups.main.length || imageGroups.compare.length) {
            const colsClass = hasBothImages ? 'grid-cols-2' : 'grid-cols-1';
            
            popupImgHtml += `<div class="grid ${colsClass} gap-1.5 w-full mb-1.5">`;
            
            if (imageGroups.main.length) {
                popupImgHtml += generatePopupImageCard(egg, 'main', imageGroups.main);
            }
            if (imageGroups.compare.length) {
                popupImgHtml += generatePopupImageCard(egg, 'compare', imageGroups.compare);
            }
            popupImgHtml += `</div>`;
        }

        return `
            <div class="marker-popup-content text-center" style="width: ${popupWidth}px;">
                <div class="text-xs font-bold mb-0.5 truncate text-gray-200 mx-auto" title="${egg.name}">${egg.name}</div>
                <div class="text-[12px] text-yellow-500 mb-2 truncate mx-auto" title="${egg.source_name}">Neta: ${egg.source_name}</div>
                ${remarkBlock}
                ${popupImgHtml}
                ${othersText}
            </div>
        `;
    }

    function generateHoverPreviewHtml(egg) {
        // 悬停预览只做“扫一眼”的信息：出处名 + 优先对比图，其次游戏截图。
        const imageGroups = getEggImageGroups(egg);
        const previewImage = imageGroups.compare[0] || imageGroups.main[0] || '';
        const previewImageSrc = escapeHtml(previewImage);
        const sourceName = escapeHtml(egg.source_name || '未知出处');
        const imageHtml = previewImage ? `
            <div class="marker-hover-image h-20 bg-black/70 rounded overflow-hidden border border-gray-700 flex items-center justify-center">
                <img src="${previewImageSrc}" class="max-w-full max-h-full object-contain" alt="点位预览图">
            </div>
        ` : `
            <div class="marker-hover-image h-14 bg-gray-950/70 rounded border border-dashed border-gray-700 flex items-center justify-center text-[10px] text-gray-500">
                暂无图片
            </div>
        `;

        return `
            <div class="marker-hover-card p-2">
                <div class="text-[10px] text-gray-400 mb-1">出处作品</div>
                <div class="text-xs font-semibold text-yellow-400 truncate mb-2" title="${sourceName}">${sourceName}</div>
                ${imageHtml}
            </div>
        `;
    }

    function closeMarkerHoverTooltip(marker) {
        if (marker.hoverTooltip && map.hasLayer(marker.hoverTooltip)) {
            map.removeLayer(marker.hoverTooltip);
        }
    }

    function shouldShowMarkerHoverTooltip(marker) {
        // 已选中任意点位时，右侧栏和点击弹窗已经承担信息展示，悬停卡片就不再打扰。
        if (isMarkingMode || currentSelectedMarker || marker.isPopupOpen()) return false;
        return true;
    }

    function renderMarkers() {
        clusterGroup.clearLayers();
        normalGroup.clearLayers();
        allMarkers.length = 0;
        currentSelectedMarker = null;

        db.locations.forEach(loc => {
            if (getLocationMapId(loc) !== currentMapId) return;
            if (activeRegionFilter && loc.district !== activeRegionFilter) return;

            const latlng = L.latLng(loc.y, loc.x);
            const marker = L.marker(latlng, {
                icon: createLocationMarkerIcon(loc)
            });

            const firstEgg = loc.eggs[0];
            updateMarkerPopup(marker, firstEgg, loc.eggs.length);
            
            marker.hoverTooltip = L.tooltip({
                direction: 'top',
                offset: [0, -14],
                opacity: 1,
                className: 'marker-hover-tooltip',
                interactive: false
            }).setContent(generateHoverPreviewHtml(firstEgg));

            marker.locationData = loc;

            marker.on('mouseover', (event) => {
                if (!shouldShowMarkerHoverTooltip(marker)) return;
                marker.hoverTooltip.setLatLng(event.latlng || marker.getLatLng()).addTo(map);
            });

            marker.on('mousemove', (event) => {
                if (!shouldShowMarkerHoverTooltip(marker)) {
                    closeMarkerHoverTooltip(marker);
                    return;
                }
                if (map.hasLayer(marker.hoverTooltip)) {
                    marker.hoverTooltip.setLatLng(event.latlng || marker.getLatLng());
                }
            });

            marker.on('mouseout', () => {
                closeMarkerHoverTooltip(marker);
            });
            
            marker.on('click', () => {
                if(isMarkingMode) return;
                closeMarkerHoverTooltip(marker);
                
                setCurrentSelectedMarker(marker);

                // 【优化2】传入手动展开的彩蛋 ID，默认展开此点位的第一个彩蛋
                openSidebar('LOCATION', { loc: loc, expandEggId: firstEgg.id });
                panMapTo(latlng);
            });
            
            allMarkers.push(marker);
            clusterGroup.addLayer(marker);
            normalGroup.addLayer(marker);
        });

        renderMapEntries();
    }

    map.on('popupopen', function(e) {
        if(currentSelectedMarker && currentSelectedMarker.getElement()) {
            const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
            if(inner) inner.classList.add('marker-selected');
        }
    });

    function setCurrentSelectedMarker(marker) {
        if (currentSelectedMarker && currentSelectedMarker.getElement()) {
            const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
            if(inner) inner.classList.remove('marker-selected');
        }

        currentSelectedMarker = marker;

        if (marker && marker.getElement()) {
            const inner = marker.getElement().querySelector('.marker-inner');
            if(inner) inner.classList.add('marker-selected');
        }
    }

    function revealMarkerAndOpenPopup(marker) {
        const openAfterMarkerVisible = () => {
            // 聚类展开后 marker 才有 DOM 元素，此时再补选中态和弹窗最稳。
            setCurrentSelectedMarker(marker);
            panMapTo(marker.getLatLng());
            marker.openPopup();
        };

        if (
            isClustered &&
            currentLayerGroup === clusterGroup &&
            typeof clusterGroup.zoomToShowLayer === 'function' &&
            clusterGroup.hasLayer(marker)
        ) {
            clusterGroup.zoomToShowLayer(marker, () => {
                setTimeout(openAfterMarkerVisible, 80);
            });
            return;
        }

        openAfterMarkerVisible();
    }

    function panMapTo(latlng) {
        const targetZoom = Math.max(map.getZoom(), CONFIG.minPanZoom);
        const sidebarWidth = sidebar.offsetWidth;
        const totalOffsetX = (sidebarWidth / 2) + CONFIG.panExtraLeftOffset;
        
        const targetPoint = map.project(latlng, targetZoom).add([totalOffsetX, 0]);
        const targetLatLng = map.unproject(targetPoint, targetZoom);
        
        map.flyTo(targetLatLng, targetZoom, { duration: CONFIG.panDuration });
    }

    map.on('click', (e) => {
        if(!isMarkingMode) closeSidebar();
    });

    function openSidebar(view, payload = null) {
        sidebar.classList.remove('translate-x-full');
        renderSidebarContent(view, payload);
    }

    function closeSidebar() {
        sidebar.classList.add('translate-x-full');
        if (currentSelectedMarker) {
            if (currentSelectedMarker.getElement()) {
                const inner = currentSelectedMarker.getElement().querySelector('.marker-inner');
                if(inner) inner.classList.remove('marker-selected');
            }
            currentSelectedMarker.closePopup();
            currentSelectedMarker = null;
        }
    }

        lucide.createIcons();
    }

    // 【优化2】接受一个 expandEggId 参数用于默认展开
    function generateEggListHTML(eggs, isFromSourceView = false, expandEggId = null) {
        if(eggs.length === 0) return `<div class="text-center text-gray-500 mt-10">暂无数据</div>`;
        return eggs.map((egg) => {
            const isUnmapped = egg.is_unmapped;
            const clickAction = isFromSourceView ? `onclick="handleSourceEggClick('${egg.id}')"` : `onclick="toggleEggDetail('egg-${egg.id}')"`;
            
            const multiTag = egg.is_multi_location ? '<span class="bg-purple-900 text-purple-200 text-[10px] px-1.5 py-0.5 rounded shrink-0 border border-purple-700" title="该彩蛋在地图中有多处出现，此为代表点位">多点位</span>' : '';
            const eggMapId = getEggMapId(egg);
            const mapTag = (isFromSourceView && eggMapId !== WORLD_MAP_ID)
                ? `<span class="bg-cyan-900/70 text-cyan-200 text-[10px] px-1.5 py-0.5 rounded shrink-0 border border-cyan-700" title="位于副本地图：${escapeHtml(mapProfiles[eggMapId]?.name || eggMapId)}">${escapeHtml(mapProfiles[eggMapId]?.name || '副本')}</span>`
                : '';

            let providerHtml = '';
            if (egg.link) {
                if (egg.link.startsWith('http')) {
                    providerHtml = `<div class="mt-3 text-right"><a href="${egg.link}" target="_blank" class="text-[10px] text-blue-400 hover:text-blue-300 transition flex items-center justify-end gap-1"><i data-lucide="external-link" class="w-3 h-3"></i> 来源参考</a></div>`;
                } else {
                    providerHtml = `<div class="mt-3 text-right text-[10px] text-gray-500 flex items-center justify-end gap-1"><i data-lucide="user" class="w-3 h-3"></i> 信息提供: ${egg.link}</div>`;
                }
            }

            // 判断是否应该处于展开状态
            const isExpanded = (expandEggId === egg.id) && !isFromSourceView;

            return `
            <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-sm shrink-0">
                <div class="p-3 cursor-pointer hover:bg-gray-700 flex justify-between items-center group" ${clickAction}>
                    <div class="flex items-center gap-2 flex-1 overflow-hidden">
                        ${multiTag}
                        ${mapTag}
                        <span class="bg-blue-900 text-blue-300 text-xs px-2 py-0.5 rounded shrink-0">${egg.type || '未知'}</span>
                        <h3 class="font-bold text-sm text-gray-200 truncate group-hover:text-white transition" title="${egg.name}">${egg.name}</h3>
                    </div>
                    ${isFromSourceView ? 
                        `<i data-lucide="${isUnmapped ? 'chevron-down' : 'map-pin'}" class="text-gray-400 w-4 h-4 shrink-0 ml-2"></i>` : 
                        `<i data-lucide="chevron-down" id="icon-egg-${egg.id}" class="text-gray-400 transition-transform w-4 h-4 shrink-0 ml-2 ${isExpanded ? 'rotate-180' : ''}"></i>`}
                </div>
                <div id="detail-egg-${egg.id}" class="${isExpanded ? '' : 'hidden'} p-3 border-t border-gray-700 bg-gray-900">
                    <div class="flex justify-between items-start mb-2">
                        ${!isFromSourceView ? `<p class="text-xs text-yellow-500 font-semibold">出处: ${egg.source_name}</p>` : '<div></div>'}
                        <span class="text-[10px] font-mono text-gray-500 bg-gray-800 px-1 rounded">${egg.id}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-3 leading-relaxed">${formatMultilineText(egg.remark, '暂无备注说明')}</p>
                    
                    ${generateEggImagesHTML(egg)}
                    
                    ${providerHtml}
                </div>
            </div>`;
        }).join('');
    }

    function generateEggImagesHTML(egg) {
        const imageGroups = getEggImageGroups(egg);
        if (!imageGroups.main.length && !imageGroups.compare.length) return '';
        
        let cols = (imageGroups.main.length && imageGroups.compare.length) ? 'grid-cols-2' : 'grid-cols-1';
        let html = `<div class="grid ${cols} gap-2 mt-2">`;
        
        if (imageGroups.main.length) {
            const firstMain = escapeHtml(imageGroups.main[0]);
            const mainCountBadgeHtml = imageGroups.main.length > 1
                ? `<div class="absolute right-1 bottom-1 bg-black/80 text-[10px] text-gray-200 px-1.5 py-0.5 rounded-sm leading-none">${imageGroups.main.length} 张</div>`
                : '';
            html += `
                <div class="flex flex-col group overflow-hidden rounded border border-gray-600 bg-black cursor-pointer hover:border-gray-400 transition-colors relative" onclick="openImageViewerForEgg('${egg.id}', 'main', 0)" title="点击查看大图">
                    <div class="flex-1 flex items-center justify-center p-0.5 relative">
                        <img src="${firstMain}" class="w-full h-auto max-h-32 object-contain" alt="游戏内截图">
                        ${mainCountBadgeHtml}
                    </div>
                    <div class="bg-gray-800 text-center text-[10px] py-1.5 text-gray-300 border-t border-gray-700">游戏内截图</div>
                </div>`;
        }
        if (imageGroups.compare.length) {
            const firstCompare = escapeHtml(imageGroups.compare[0]);
            const compareCountBadgeHtml = imageGroups.compare.length > 1
                ? `<div class="absolute right-1 bottom-1 bg-black/80 text-[10px] text-gray-200 px-1.5 py-0.5 rounded-sm leading-none">${imageGroups.compare.length} 张</div>`
                : '';
            html += `
                <div class="flex flex-col group overflow-hidden rounded border border-gray-600 bg-black cursor-pointer hover:border-gray-400 transition-colors relative" onclick="openImageViewerForEgg('${egg.id}', 'compare', 0)" title="点击查看大图">
                    <div class="flex-1 flex items-center justify-center p-0.5 relative">
                        <img src="${firstCompare}" class="w-full h-auto max-h-32 object-contain" alt="出处对比图">
                        ${compareCountBadgeHtml}
                    </div>
                    <div class="bg-gray-800 text-center text-[10px] py-1.5 text-gray-300 border-t border-gray-700">出处对比图</div>
                </div>`;
        }
        
        html += `</div>`;
        return html;
    }

    function focusEggOnMap(egg, backToSourceId = null) {
        if (!egg || egg.is_unmapped || !egg.location) return;

        const targetMapId = getEggMapId(egg);
        if (targetMapId !== currentMapId) {
            switchMap(targetMapId);
        }

        const targetMarker = allMarkers.find(m => m.locationData.id === egg.location.id);
        if (targetMarker) {
            // 从总表进入副本内彩蛋时，先切地图，再精准展开对应彩蛋。
            updateMarkerPopup(targetMarker, egg, egg.location.eggs.length);
            openSidebar('LOCATION', { loc: egg.location, backTo: backToSourceId, expandEggId: egg.id });
            revealMarkerAndOpenPopup(targetMarker);
        }
    }

    function handleSourceEggClick(eggId) {
        const egg = eggMap[eggId];
        if (egg.is_unmapped) {
            toggleEggDetail(`egg-${egg.id}`); 
            return;
        }

        focusEggOnMap(egg, egg.source_id);
    }

    function toggleEggDetail(id) {
        const detailDiv = document.getElementById(`detail-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if (detailDiv.classList.contains('hidden')) {
            detailDiv.classList.remove('hidden');
            if(icon) icon.classList.add('rotate-180');
        } else {
            detailDiv.classList.add('hidden');
            if(icon) icon.classList.remove('rotate-180');
        }

        const eggId = id.replace('egg-', '');
        const egg = eggMap[eggId];
        if (egg && !egg.is_unmapped && egg.location) {
            if (getEggMapId(egg) !== currentMapId) {
                switchMap(getEggMapId(egg));
            }
            const targetMarker = allMarkers.find(m => m.locationData.id === egg.location.id);
            if (targetMarker) {
                updateMarkerPopup(targetMarker, egg, egg.location.eggs.length);
            }
        }
    }

    function toggleCityAccordion(city) {
        const div = document.getElementById(`districts-${city}`);
        const icon = document.getElementById(`icon-city-${city}`);
        div.classList.toggle('hidden');
        icon.classList.toggle('rotate-180');
    }

    function filterByRegion(district) {
        activeRegionFilter = district;
        renderMarkers(); 
        openSidebar('CITIES'); 
    }

    function filterSources(keyword) {
        const container = document.getElementById('source-list-container');
        if(!container) return;
        
        const lowerKw = keyword.toLowerCase();
        const html = db.sources
            .filter(s => s.name.toLowerCase().includes(lowerKw))
            .map(s => `
                <div class="p-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg cursor-pointer text-sm text-gray-200 transition flex justify-between items-center shrink-0" onclick="openSidebar('SOURCE_DETAIL', '${s.id}')">
                    <span class="font-semibold">${s.name}</span>
                    <span class="text-xs text-gray-500 bg-gray-900 px-2 py-1 rounded-full">${sourceEggsMap[s.id]?.length || 0}</span>
                </div>
            `).join('');
        container.innerHTML = html || `<div class="text-center text-gray-500 text-sm mt-4">未找到结果</div>`;
    }

    function filterUnmapped(keyword) {
        const container = document.getElementById('unmapped-list-container');
        if(!container) return;
        
        const lowerKw = keyword.toLowerCase();
        const filteredEggs = db.unmapped.filter(egg => egg.name.toLowerCase().includes(lowerKw) || egg.source_name.toLowerCase().includes(lowerKw));
        
        container.innerHTML = generateEggListHTML(filteredEggs, false); 
        lucide.createIcons();
    }

    function toggleSettings() {
        document.getElementById('settings-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', function(event) {
        const menu = document.getElementById('settings-menu');
        const settingsBtn = menu.previousElementSibling;
        if (!menu.contains(event.target) && !settingsBtn.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });

    let markingPopup = L.popup();
    function toggleMarkingMode(enabled) {
        isMarkingMode = enabled;
        closeSidebar();
        
        if (isMarkingMode) {
            map.removeLayer(currentLayerGroup);
            map.on('click', onMapClickForMarking);
            document.getElementById('map').style.cursor = 'crosshair';
        } else {
            map.addLayer(currentLayerGroup);
            map.off('click', onMapClickForMarking);
            document.getElementById('map').style.cursor = '';
            map.closePopup();
        }
    }

    function onMapClickForMarking(e) {
        if (!isMarkingMode) return;
        const x = Math.round(e.latlng.lng);
        const y = Math.round(e.latlng.lat);
        const mapIdHtml = currentMapId === WORLD_MAP_ID
            ? ''
            : `<div class="bg-gray-200 p-2 rounded text-sm select-all border border-gray-300 mt-1">副本ID: ${escapeHtml(currentMapId)}</div>`;
        markingPopup.setLatLng(e.latlng).setContent(`
            <div class="text-center font-mono text-gray-900">
                <div class="font-bold text-gray-900 mb-1">目标坐标</div>
                <div class="bg-gray-200 p-2 rounded text-sm select-all border border-gray-300">"x": ${x}, "y": ${y}</div>
                ${mapIdHtml}
            </div>
        `).openOn(map);
    }

    function toggleClustering(enabled) {
        isClustered = enabled;
        if (isMarkingMode) return; 
        map.removeLayer(currentLayerGroup);
        currentLayerGroup = isClustered ? clusterGroup : normalGroup;
        map.addLayer(currentLayerGroup);
    }

    // ================== 图片查看器（Lightbox）高级交互逻辑 ==================
    const viewer = document.getElementById('image-viewer');
    const viewerImg = document.getElementById('viewer-image');
    const viewerTitle = document.getElementById('viewer-title');
    const viewerPosition = document.getElementById('viewer-position');
    const viewerPrevBtn = document.getElementById('viewer-prev');
    const viewerNextBtn = document.getElementById('viewer-next');
    
    let imgScale = 1;
    let imgPanX = 0;
    let imgPanY = 0;
    let viewerImageItems = [];
    let viewerImageIndex = 0;
    
    let isDraggingImg = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function updateViewerTransform() {
        viewerImg.style.transform = `translate(${imgPanX}px, ${imgPanY}px) scale(${imgScale})`;
    }

    function resetViewerImageTransform() {
        imgScale = 1;
        imgPanX = 0;
        imgPanY = 0;
        updateViewerTransform();
    }

    function getViewerImageItems(egg) {
        const imageGroups = getEggImageGroups(egg);
        const mainItems = imageGroups.main.map((src, index) => ({
            src,
            kind: 'main',
            title: '游戏内截图',
            indexInKind: index,
            kindTotal: imageGroups.main.length
        }));
        const compareItems = imageGroups.compare.map((src, index) => ({
            src,
            kind: 'compare',
            title: '出处对比图',
            indexInKind: index,
            kindTotal: imageGroups.compare.length
        }));

        // 顺序决定左右翻页关系：截图最后一张向右进入对比图，对比图第一张向左回到截图。
        return [...mainItems, ...compareItems];
    }

    function openImageViewerForEgg(eggId, imageKind = 'main', imageIndex = 0) {
        const egg = eggMap[eggId];
        if (!egg) return;

        const items = getViewerImageItems(egg);
        if (!items.length) return;

        let startIndex = items.findIndex(item => item.kind === imageKind && item.indexInKind === imageIndex);
        if (startIndex < 0) startIndex = 0;

        openImageViewerWithItems(items, startIndex);
    }

    function openImageViewer(imgSrc) {
        // 兼容旧调用：如果以后还有零散单图入口，也能直接打开。
        openImageViewerWithItems([{ src: imgSrc, kind: 'single', title: '图片预览', indexInKind: 0, kindTotal: 1 }], 0);
    }

    function openImageViewerWithItems(items, startIndex) {
        viewerImageItems = items;
        viewerImageIndex = startIndex;
        showViewerImage(startIndex);

        viewer.classList.remove('hidden');
        setTimeout(() => {
            viewer.classList.remove('opacity-0');
        }, 10);
    }

    function updateViewerNavigation() {
        const total = viewerImageItems.length;
        const shouldShowArrows = total > 1;
        viewerPrevBtn.classList.toggle('hidden', !shouldShowArrows);
        viewerNextBtn.classList.toggle('hidden', !shouldShowArrows);

        if (!shouldShowArrows) return;

        // 多图时左右翻页始终可用，首尾会循环到另一端，方便截图组和出处组快速来回切换。
        viewerPrevBtn.disabled = false;
        viewerNextBtn.disabled = false;
        viewerPrevBtn.classList.remove('opacity-30', 'cursor-not-allowed');
        viewerNextBtn.classList.remove('opacity-30', 'cursor-not-allowed');
    }

    function showViewerImage(index) {
        if (index < 0 || index >= viewerImageItems.length) return;

        viewerImageIndex = index;
        const item = viewerImageItems[viewerImageIndex];
        viewerImg.src = item.src;
        viewerTitle.textContent = item.title;

        const total = viewerImageItems.length;
        const kindText = total === item.kindTotal
            ? `第 ${item.indexInKind + 1} 张 / 共 ${item.kindTotal} 张`
            : `本类 ${item.indexInKind + 1}/${item.kindTotal} · 总计 ${viewerImageIndex + 1}/${total}`;
        viewerPosition.textContent = kindText;

        resetViewerImageTransform();
        updateViewerNavigation();
    }

    function showPreviousViewerImage() {
        const total = viewerImageItems.length;
        if (total <= 1) return;

        // 从第一张继续左翻会跳到最后一张，例如游戏截图第一张 -> 出处对比最后一张。
        showViewerImage((viewerImageIndex - 1 + total) % total);
    }

    function showNextViewerImage() {
        const total = viewerImageItems.length;
        if (total <= 1) return;

        // 从最后一张继续右翻会回到第一张，例如出处对比最后一张 -> 游戏截图第一张。
        showViewerImage((viewerImageIndex + 1) % total);
    }

    function closeImageViewer() {
        viewer.classList.add('opacity-0');
        setTimeout(() => {
            viewer.classList.add('hidden');
            viewerImg.src = '';
            viewerImageItems = [];
            viewerImageIndex = 0;
            resetViewerImageTransform();
        }, 300);
    }

    viewer.addEventListener('wheel', (e) => {
        if (viewer.classList.contains('hidden')) return;
        
        e.preventDefault(); 

        const zoomSensitivity = 0.1;
        const delta = e.deltaY < 0 ? 1 : -1;
        let newScale = imgScale * (1 + delta * zoomSensitivity);
        
        newScale = Math.max(0.5, Math.min(newScale, 10));

        imgScale = newScale;
        updateViewerTransform();
    }, { passive: false });

    viewerImg.addEventListener('mousedown', (e) => {
        e.preventDefault(); 
        isDraggingImg = true;
        // 记录鼠标按下时，相对于当前平移位置的偏移量
        dragStartX = e.clientX - imgPanX;
        dragStartY = e.clientY - imgPanY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDraggingImg) return;
        imgPanX = e.clientX - dragStartX;
        imgPanY = e.clientY - dragStartY;
        updateViewerTransform();
    });

    window.addEventListener('mouseup', () => {
        isDraggingImg = false;
    });

    viewer.addEventListener('click', (e) => {
        if (e.target === viewer) {
            closeImageViewer();
        }
    });

    viewerImg.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    window.addEventListener('keydown', (e) => {
        if (viewer.classList.contains('hidden')) return;

        if (e.key === 'Escape') closeImageViewer();
        if (e.key === 'ArrowLeft') showPreviousViewerImage();
        if (e.key === 'ArrowRight') showNextViewerImage();
    });

</script>
</body>
</html>
